<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173c35">
  <meta name="description" content="選擇乘法星球或森林動物冒險，透過滑鼠操作練習國小乘法。">
  <title>數學冒險入口｜選擇遊戲</title>
  <style>
    :root { color-scheme: light; font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; color: #203b35; background: #eef4e8; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; background: radial-gradient(ellipse at 12% 4%, #cfe5d3 0, transparent 31rem), radial-gradient(ellipse at 90% 92%, #dce9c5 0, transparent 30rem), #eef4e8; }
    .page { width: min(1080px, calc(100% - 36px)); margin: auto; padding: 52px 0 64px; }
    .intro { margin: 0 auto 35px; text-align: center; }
    .kicker { color: #54866c; font-size: 13px; font-weight: 900; letter-spacing: .18em; }
    h1 { margin: 12px 0 9px; color: #1e493f; font-size: clamp(34px, 6vw, 60px); line-height: 1.14; }
    .intro p { margin: 0; color: #61766a; font-size: clamp(15px, 2vw, 18px); }
    .choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; }
    .game-card { display: flex; min-height: 390px; flex-direction: column; overflow: hidden; border: 1px solid #d5e1d4; border-radius: 28px; background: #fffdf7; box-shadow: 0 18px 55px #254b3914; transition: transform .2s ease, box-shadow .2s ease; }
    .game-card:hover { transform: translateY(-5px); box-shadow: 0 24px 64px #254b3926; }
    .illustration { display: grid; min-height: 185px; place-items: center; font-size: 74px; }
    .planet .illustration { background: linear-gradient(135deg,#e1f2f5,#e3edfb 65%,#f8edce); }
    .forest .illustration { background: linear-gradient(135deg,#d5ead0,#e5f0d1 65%,#f4e6c5); }
    .card-copy { display: flex; flex: 1; flex-direction: column; padding: 24px 27px 27px; }
    .tag { color: #6b8a72; font-size: 12px; font-weight: 900; letter-spacing: .1em; }
    h2 { margin: 7px 0 10px; color: #254c40; font-size: 25px; }
    .card-copy p { margin: 0 0 22px; color: #66786d; line-height: 1.75; }
    a.play { display: inline-flex; min-height: 48px; align-items: center; justify-content: center; gap: 9px; margin-top: auto; border-radius: 14px; color: white; background: #34795d; font-weight: 800; text-decoration: none; transition: background .15s ease; }
    .planet a.play { background: #317f91; }
    a.play:hover { background: #285e49; }
    .planet a.play:hover { background: #246575; }
    a.play:focus-visible { outline: 3px solid #dfaa42; outline-offset: 3px; }
    .footnote { margin: 27px 0 0; color: #738276; font-size: 13px; text-align: center; }
    @media (max-width: 700px) { .page { padding-top: 35px; } .choices { grid-template-columns: 1fr; } .game-card { min-height: 0; } .illustration { min-height: 150px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="page">
    <header class="intro">
      <div class="kicker">MATH ADVENTURE</div>
      <h1>今天想玩哪一場？</h1>
      <p>選一個冒險，和角色一起用乘法解開前進線索。</p>
    </header>
    <section class="choices" aria-label="選擇數學遊戲">
      <article class="game-card planet">
        <div class="illustration" aria-hidden="true">🚀 🪐 ✨</div>
        <div class="card-copy">
          <span class="tag">五關乘法冒險</span>
          <h2>乘法星球</h2>
          <p>太空人迷失在星際之間。用滑鼠帶他收集正確答案，解開五關乘法挑戰，找到回地球的路。</p>
          <a class="play" href="./multiplication-planet.html">進入乘法星球 <span aria-hidden="true">→</span></a>
        </div>
      </article>
      <article class="game-card forest">
        <div class="illustration" aria-hidden="true">🧭 🌲 🦊</div>
        <div class="card-copy">
          <span class="tag">十種遊戲機制・都能直接玩</span>
          <h2>森林動物冒險</h2>
          <p>探險家在森林迷路，松鼠、青蛙、熊貓和白鹿一路提供線索。探索十種不同的乘法遊戲玩法，每一種都能直接操作或全螢幕遊玩。</p>
          <a class="play" href="./game-based-learning.html#mechanisms">進入森林冒險 <span aria-hidden="true">→</span></a>
        </div>
      </article>
    </section>
    <p class="footnote">兩場冒險都使用滑鼠操作，答對 +10 分，答錯 −5 分。</p>
  </main>
</body>
</html>
