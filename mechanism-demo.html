<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eaf2df">
  <title>森林乘法機制小示範</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.88.2/dist/phaser.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { color: #294936; background: #f7f8ee; font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; }
    #app { display: flex; width: 100%; height: 100%; flex-direction: column; padding: 7px; gap: 5px; }
    .hud { display: flex; min-height: 39px; align-items: center; justify-content: space-between; gap: 5px; }
    .title { overflow: hidden; color: #426344; font-size: 11px; font-weight: 850; text-overflow: ellipsis; white-space: nowrap; }
    .stats { display: flex; align-items: center; gap: 5px; }
    .stat { min-width: 47px; padding: 4px 6px; border-radius: 9px; background: #e9f0e2; text-align: center; }
    .stat span { display: block; color: #72806d; font-size: 8px; font-weight: 750; }
    .stat strong { display: block; color: #294936; font-size: 12px; line-height: 1.2; }
    .stat.timer { display: none; background: #fff0d8; }
    body[data-mechanic="timer"] .stat.timer { display: block; }
    .stat.life { display: none; }
    body[data-mechanic="lives"] .stat.life { display: block; }
    #route-picker { display: none; align-items: center; justify-content: center; gap: 5px; }
    body[data-mechanic="choice"] #route-picker { display: flex; }
    .route { border: 1px solid #c9d8c2; border-radius: 999px; padding: 4px 8px; color: #35573b; background: #fff; font: inherit; font-size: 9px; font-weight: 800; cursor: pointer; }
    .route[aria-pressed="true"] { color: #fff; background: #477d4c; }
    #message { min-height: 22px; overflow: hidden; color: #637461; font-size: 10px; font-weight: 750; line-height: 1.3; text-align: center; text-overflow: ellipsis; white-space: nowrap; }
    #game { display: grid; min-height: 0; flex: 1; place-items: center; overflow: hidden; border: 1px solid #d4e4ce; border-radius: 13px; background: #e9f2de; }
    #game canvas { display: block; max-width: 100%; max-height: 100%; touch-action: none; }
    .fallback { padding: 16px; color: #8b5143; font-size: 12px; text-align: center; }
    @media (max-width: 390px) { #app { padding: 5px; } .stat { min-width: 40px; padding-inline: 4px; } .title { max-width: 100px; } }
    body.embed-mode { background: #f7f8ee; }
    body.embed-mode #app { padding: 5px; }
  </style>
</head>
<body>
  <main id="app">
    <header class="hud">
      <div class="title" id="demo-title">森林乘法小示範</div>
      <div class="stats" aria-label="示範進度">
        <div class="stat"><span>分數</span><strong id="score">0</strong></div>
        <div class="stat"><span>進度</span><strong id="progress">1 / 3</strong></div>
        <div class="stat life"><span>生命</span><strong id="lives">♥ ♥ ♥</strong></div>
        <div class="stat timer"><span>秒數</span><strong id="timer">15</strong></div>
      </div>
    </header>
    <div id="route-picker" aria-label="路線選擇">
      <button class="route" type="button" data-route="safe" aria-pressed="false">安全小徑　+10 / −5</button>
      <button class="route" type="button" data-route="risky" aria-pressed="false">冒險捷徑　+20 / −10</button>
    </div>
    <div id="message" role="status" aria-live="polite">點選一個動物答案，開始小挑戰。</div>
    <div id="game" aria-label="滑鼠操作乘法小示範"></div>
  </main>
  <script>
    (() => {
      const names = {
        mission: '任務目標', reward: '點數與獎勵', feedback: '即時回饋', memory: '記憶提取', timer: '限時挑戰',
        choice: '風險與選擇', lives: '生命與再次嘗試', planning: '空間規劃', clue: '線索推理', progression: '漸進難度'
      };
      const mechanic = new URLSearchParams(location.search).get('mechanic') || 'mission';
      const mode = names[mechanic] ? mechanic : 'mission';
      document.body.dataset.mechanic = mode;
      if (new URLSearchParams(location.search).get('embed') === '1') document.body.classList.add('embed-mode');
      const message = document.getElementById('message');
      const scoreText = document.getElementById('score');
      const progressText = document.getElementById('progress');
      const livesText = document.getElementById('lives');
      const timerText = document.getElementById('timer');
      const routeButtons = [...document.querySelectorAll('.route')];
      document.getElementById('demo-title').textContent = `${names[mode]}・森林小示範`;

      if (!window.Phaser) {
        document.getElementById('game').innerHTML = '<div class="fallback">遊戲引擎載入失敗，請確認網路連線後重新整理。</div>';
        return;
      }

      const prompts = mode === 'progression'
        ? [{ a: 2, b: 3 }, { a: 4, b: 5 }, { a: 7, b: 8 }]
        : [{ a: 2, b: 3 }, { a: 3, b: 4 }, { a: 4, b: 5 }];
      const notes = {
        mission: '完成三題，收集三個森林路標。',
        reward: '連續答對可獲得徽章與額外分數。',
        feedback: '作答後會看到乘法拆解提示。',
        memory: '答完後再回想一次剛才的算式。',
        timer: '每題倒數十五秒，時間內找到答案。',
        choice: '先選一條路，再承擔對應的分數變化。',
        lives: '答錯會失去一顆心，連勝可補回。',
        planning: '觀察動物的位置，再規劃移動路線。',
        clue: '先看乘法提示，再選擇答案。',
        progression: '每題數字變大，挑戰逐步增加。'
      };
      message.textContent = notes[mode];

      class MechanismDemo extends Phaser.Scene {
        constructor() {
          super('MechanismDemo');
        }

        init() {
          this.index = 0;
          this.score = 0;
          this.lives = 3;
          this.streak = 0;
          this.badges = 0;
          this.memoryQuestion = null;
          this.recallPhase = false;
          this.resolved = false;
          this.route = null;
          this.timerEvent = null;
          this.questionTime = 15;
          this.choiceItems = [];
          scoreText.textContent = '0';
          progressText.textContent = `1 / ${prompts.length}`;
          livesText.textContent = '♥ ♥ ♥';
          timerText.textContent = '15';
          message.textContent = notes[mode];
          routeButtons.forEach((button) => button.setAttribute('aria-pressed', 'false'));
        }

        create() {
          this.drawForest();
          this.hudText = this.add.text(220, 17, '', { fontFamily: 'system-ui, sans-serif', fontSize: '14px', fontStyle: 'bold', color: '#365b3b' }).setOrigin(.5);
          this.hintText = this.add.text(220, 44, '', { fontFamily: 'system-ui, sans-serif', fontSize: '10px', fontStyle: 'bold', color: '#637461', align: 'center', wordWrap: { width: 410 } }).setOrigin(.5);
          this.routeButtons = routeButtons;
          this.routeButtons.forEach((button) => { button.onclick = () => {
            if (mode !== 'choice' || this.resolved) return;
            this.route = button.dataset.route;
            this.routeButtons.forEach((item) => item.setAttribute('aria-pressed', String(item === button)));
            message.textContent = this.route === 'risky' ? '已選冒險捷徑，答對加分較多，答錯扣分也較多。' : '已選安全小徑，穩穩收集森林路標。';
          }; });
          this.showQuestion();
        }

        drawForest() {
          const g = this.add.graphics();
          g.fillStyle(0xe9f2de, 1).fillRect(0, 0, 440, 220);
          g.fillStyle(0xd8e8c7, .9).fillEllipse(220, 185, 390, 72);
          g.lineStyle(18, 0xcbb58c, .85).beginPath().moveTo(220, 220).lineTo(234, 188).lineTo(208, 156).lineTo(224, 128).strokePath();
          [[35,38],[405,36],[52,184],[390,185]].forEach(([x,y], index) => {
            const green = index % 2 ? 0x63945c : 0x79a66a;
            g.fillStyle(0x78593c, 1).fillRoundedRect(x - 5, y + 10, 10, 37, 4);
            g.fillStyle(green, .96).fillCircle(x, y, 21).fillCircle(x - 14, y + 10, 14).fillCircle(x + 14, y + 10, 14);
            g.fillStyle(0xb8d187, .7).fillCircle(x - 6, y - 6, 4);
          });
          [[112,195],[329,194],[143,81],[297,79]].forEach(([x,y], index) => g.fillStyle(index % 2 ? 0xe9b957 : 0xf0d477, .9).fillCircle(x,y,3));
          g.destroy();
        }

        question() {
          return this.recallPhase ? this.memoryQuestion : prompts[this.index];
        }

        showQuestion() {
          this.resolved = false;
          this.stopTimer();
          this.questionTime = 15;
          timerText.textContent = '15';
          this.route = null;
          routeButtons.forEach((button) => button.setAttribute('aria-pressed', 'false'));
          this.choiceItems.forEach((item) => item.destroy());
          this.choiceItems = [];
          const q = this.question();
          const answer = q.a * q.b;
          const options = Phaser.Utils.Array.Shuffle([...new Set([answer, answer + q.a, Math.max(1, answer - q.a)])]);
          const positions = mode === 'planning' ? [[80,131],[220,101],[360,131]] : [[90,139],[220,139],[350,139]];
          this.hudText.setText(`${q.a} × ${q.b} = ?`);
          const phase = this.recallPhase ? '回想上一題，再算一次' : `第 ${this.index + 1} 題　找到正確答案動物`;
          this.hintText.setText(this.hintFor(q, phase));
          progressText.textContent = `${this.index + 1} / ${prompts.length}`;
          if (mode === 'timer') this.startTimer();

          options.forEach((value, i) => {
            const [x, y] = positions[i];
            const container = this.add.container(x, y);
            const disk = this.add.graphics();
            const colors = [0xf4d782,0xc6dfb7,0xd5e5e5];
            disk.fillStyle(0xffffff, .7).fillEllipse(0, 21, 72, 12);
            disk.fillStyle(colors[i], 1).fillCircle(0, -5, 32);
            disk.lineStyle(3, 0xffffff, .95).strokeCircle(0, -5, 29);
            disk.fillStyle(i === 1 ? 0x74a45d : 0x84a962, .9).fillEllipse(-16, 13, 19, 9).fillEllipse(14, 14, 20, 9);
            const animal = this.add.text(0, -12, ['🐿️','🐸','🦉'][i], { fontFamily: 'system-ui, sans-serif', fontSize: '21px' }).setOrigin(.5);
            const number = this.add.text(0, 12, String(value), { fontFamily: 'system-ui, sans-serif', fontSize: '16px', fontStyle: 'bold', color: '#294936', stroke: '#ffffff', strokeThickness: 3 }).setOrigin(.5);
            container.add([disk, animal, number]).setSize(72, 70).setInteractive(new Phaser.Geom.Circle(0, -4, 37), Phaser.Geom.Circle.Contains);
            container.on('pointerover', () => container.setScale(1.08));
            container.on('pointerout', () => container.setScale(1));
            container.on('pointerdown', () => this.answer(value === answer));
            this.choiceItems.push(container);
          });

          if (mode === 'planning') {
            const map = this.add.graphics().setDepth(-1);
            map.lineStyle(3, 0x6b9360, .65).beginPath().moveTo(220, 205).lineTo(220, 172).lineTo(positions[0][0], positions[0][1] + 30).moveTo(220, 172).lineTo(positions[1][0], positions[1][1] + 30).moveTo(220, 172).lineTo(positions[2][0], positions[2][1] + 30).strokePath();
            this.choiceItems.push(map);
          }
        }

        hintFor(q, phase) {
          if (mode === 'clue' || (mode === 'feedback' && this.recallPhase)) return `${phase}　提示：${q.a} × ${q.b} = ${q.a} × ${q.b - 1} + ${q.a}`;
          if (mode === 'planning') return '先比較三條小徑的位置，再點動物答案';
          if (mode === 'memory' && this.recallPhase) return `回想：${q.a} × ${q.b} 是多少？`;
          if (mode === 'mission') return `${phase}　收集路標 ${this.index} / ${prompts.length}`;
          if (mode === 'reward') return `${phase}　連勝 ${this.streak} 題，徽章 ${this.badges} 枚`;
          if (mode === 'lives') return `${phase}　答對連勝兩題可補回一顆心`;
          if (mode === 'choice') return `${phase}　先在上方選安全或冒險路線`;
          return phase;
        }

        answer(correct) {
          if (this.resolved) return;
          if (mode === 'choice' && !this.route) {
            message.textContent = '先選上方的安全小徑或冒險捷徑。';
            return;
          }
          this.resolved = true;
          this.stopTimer();
          const q = this.question();
          if (correct) {
            this.streak += 1;
            this.score += mode === 'choice' && this.route === 'risky' ? 20 : 10;
            if (mode === 'reward' && this.streak % 3 === 0) {
              this.score += 15;
              this.badges += 1;
            }
            if (mode === 'lives' && this.streak % 2 === 0) this.lives = Math.min(3, this.lives + 1);
            message.textContent = mode === 'feedback'
              ? `答對！${q.a} × ${q.b} = ${q.a} × ${q.b - 1} + ${q.a}`
              : mode === 'reward' && this.streak % 3 === 0 ? '連續答對三題，獲得徽章與 +15 分！' : '答對了，動物朋友帶你找到下一個路標！';
          } else {
            this.streak = 0;
            this.score -= mode === 'choice' && this.route === 'risky' ? 10 : 5;
            if (mode === 'lives') this.lives -= 1;
            message.textContent = `再想一想：${q.a} × ${q.b} = ${q.a} × ${q.b - 1} + ${q.a}`;
          }
          this.updateHud();
          if (mode === 'lives' && this.lives <= 0) {
            this.time.delayedCall(800, () => this.finish(false));
            return;
          }
          this.time.delayedCall(850, () => this.advance());
        }

        advance() {
          if (mode === 'memory' && !this.recallPhase && !this.memoryQuestion) {
            this.memoryQuestion = prompts[this.index];
            this.recallPhase = true;
            message.textContent = '動物朋友要考考你的記憶，回想剛才的算式。';
            return this.showQuestion();
          }
          if (this.recallPhase) {
            this.recallPhase = false;
            this.memoryQuestion = null;
          }
          this.index += 1;
          if (this.index >= prompts.length) return this.finish(true);
          this.showQuestion();
        }

        updateHud() {
          scoreText.textContent = String(this.score);
          livesText.textContent = '♥ '.repeat(this.lives).trim() || '0';
          progressText.textContent = `${Math.min(this.index + 1, prompts.length)} / ${prompts.length}`;
        }

        startTimer() {
          this.timerEvent = this.time.addEvent({ delay: 1000, loop: true, callback: () => {
            this.questionTime -= 1;
            timerText.textContent = String(this.questionTime);
            if (this.questionTime <= 0) {
              message.textContent = '時間到！換一題繼續找路標。';
              this.answer(false);
            }
          }});
        }

        stopTimer() {
          if (this.timerEvent) this.timerEvent.remove();
          this.timerEvent = null;
        }

        finish(won) {
          this.stopTimer();
          this.choiceItems.forEach((item) => item.destroy());
          this.choiceItems = [];
          const veil = this.add.graphics().setDepth(10);
          veil.fillStyle(0x294936, .78).fillRoundedRect(35, 27, 370, 166, 18);
          const title = this.add.text(220, 70, won ? '找到森林路標！' : '再找一位動物朋友幫忙吧', { fontFamily: 'system-ui, sans-serif', fontSize: '19px', fontStyle: 'bold', color: '#ffffff', align: 'center', wordWrap: { width: 340 } }).setOrigin(.5).setDepth(11);
          const details = this.add.text(220, 105, `三題小示範完成　得分 ${this.score}`, { fontFamily: 'system-ui, sans-serif', fontSize: '13px', color: '#f3f5dc', align: 'center' }).setOrigin(.5).setDepth(11);
          const button = this.add.rectangle(220, 155, 135, 37, 0xf1d175, 1).setDepth(11).setInteractive({ useHandCursor: true });
          const restart = this.add.text(220, 155, '再玩一次', { fontFamily: 'system-ui, sans-serif', fontSize: '13px', fontStyle: 'bold', color: '#294936' }).setOrigin(.5).setDepth(12);
          button.on('pointerdown', () => this.scene.restart());
          [veil, title, details, button, restart].forEach((item) => this.choiceItems.push(item));
          message.textContent = '這是短版機制示範，可重新挑戰。';
        }
      }

      new Phaser.Game({
        type: Phaser.AUTO,
        parent: 'game',
        width: 440,
        height: 220,
        backgroundColor: '#e9f2de',
        scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
        scene: MechanismDemo
      });
    })();
  </script>
</body>
</html>
